<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBooster — 큐브시스템</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="logo">
                <img src="/src/assets/logo.png" alt="BBooster" height="32">
                <span>BBooster</span>
            </div>
            <div class="status-indicators">
                <div class="status-light-group">
                    <span class="status-light" id="light-server"></span>
                    <span id="server-status" class="status-text">Server: --</span>
                </div>
                <div class="status-light-group">
                    <span class="status-light" id="light-estop"></span>
                    <span id="estop-status" class="status-text">E-STOP: --</span>
                </div>
            </div>
        </header>

        <!-- Week C: Status Overview Panel -->
        <section class="status-overview">
            <div class="stat-card">
                <div class="stat-label">Last Signal</div>
                <div class="stat-value" id="last-signal">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Last Order</div>
                <div class="stat-value" id="last-order">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Last Filled</div>
                <div class="stat-value" id="last-filled">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">System Status</div>
                <div class="stat-value" id="system-status">--</div>
            </div>
        </section>

        <main class="main">
            <section class="card server-control">
                <h2>Server Control</h2>
                <div class="button-group">
                    <button id="btn-start" class="btn btn-success">Start Server</button>
                    <button id="btn-stop" class="btn btn-danger">Stop Server</button>
                    <button id="btn-dashboard" class="btn btn-primary">Open Dashboard</button>
                </div>
            </section>

            <section class="card estop-control">
                <h2>E-STOP Control</h2>
                <p class="description">Emergency stop - blocks all new orders</p>
                <div class="button-group">
                    <button id="btn-estop-on" class="btn btn-danger">E-STOP ON</button>
                    <button id="btn-estop-off" class="btn btn-success">E-STOP OFF</button>
                </div>
            </section>

            <!-- Week C: Order Timeline -->
            <section class="card order-timeline">
                <h2>Order Timeline</h2>
                <div id="timeline-list" class="timeline-list">
                    <p class="empty">Loading...</p>
                </div>
            </section>

            <section class="card recent-events">
                <h2>Recent Events</h2>
                <div id="events-list" class="events-list">
                    <p class="empty">Loading...</p>
                </div>
            </section>

            <section class="card tools">
                <h2>Tools</h2>
                <div class="button-group">
                    <button id="btn-logs" class="btn btn-secondary">Open Logs Folder</button>
                    <button id="btn-diagnostic" class="btn btn-secondary">Export Diagnostic</button>
                </div>
            </section>

            <!-- Week C: Error Guide Panel -->
            <section class="card error-guide" id="error-guide" style="display: none;">
                <h2>Error Resolution</h2>
                <div class="error-content">
                    <div class="error-message" id="error-message"></div>
                    <div class="error-solution" id="error-solution"></div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>BBooster v1.0.0 | 큐브시스템 (QUBE System) | <a href="#" id="link-help">Help</a></p>
        </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
