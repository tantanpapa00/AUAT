[package]
name = "bbooster"
version = "1.0.0"
description = "BBooster - Asset Upward with Auto Trading"
authors = ["BBooster Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [
    "shell-open",
    "system-tray",
    "window-close",
    "window-hide",
    "window-show",
    "window-minimize",
    "window-set-focus",
    "window-unminimize",
    "process-command-api",
    "process-all",
    "fs-all",
    "http-all",
    "path-all",
    "devtools"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
keyring = "2"
chrono = "0.4"
aes-gcm = "0.10"
rand = "0.8"
zip = "0.6"
dirs = "5"
open = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
