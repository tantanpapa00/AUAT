name: bbooster
description: BBooster Mobile App - Trading automation monitor

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.1.0

  # Secure storage for tokens
  flutter_secure_storage: ^9.0.0

  # State management
  provider: ^6.1.0

  # WebView for TradingView charts
  webview_flutter: ^4.4.0

  # Pull to refresh
  pull_to_refresh: ^2.0.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
