# bbooster.conf - BBooster Site Configuration
# /etc/nginx/conf.d/bbooster.conf 에 복사

# HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt 인증용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지는 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 메인 서버
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL 설정 (보안 강화)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # 최신 TLS만 허용
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (Strict Transport Security)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 루트 디렉토리 (랜딩 페이지)
    root /var/www/bbooster/landing;
    index index.html;

    # ============================================
    # 1) 랜딩 페이지 (정적 파일)
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 법적 페이지
    location /terms {
        alias /var/www/bbooster/landing;
        try_files /terms.html =404;
    }

    location /privacy {
        alias /var/www/bbooster/landing;
        try_files /privacy.html =404;
    }

    location /risk {
        alias /var/www/bbooster/landing;
        try_files /risk.html =404;
    }

    # ============================================
    # 2) API 엔드포인트 (FastAPI 프록시)
    # ============================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://bbooster_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # 3) TradingView 웹훅 (/tv)
    # ============================================
    location /tv {
        limit_req zone=webhook_limit burst=10 nodelay;

        proxy_pass http://bbooster_api/tv;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type application/json;

        # 웹훅은 빠른 응답 필요
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================
    # 4) 웹 대시보드
    # ============================================
    location /dashboard {
        proxy_pass http://bbooster_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # 5) Swagger 문서 (개발용, 프로덕션에서는 제거 권장)
    # ============================================
    location /docs {
        proxy_pass http://bbooster_api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /redoc {
        proxy_pass http://bbooster_api/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://bbooster_api/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ============================================
    # 6) 정적 파일 캐싱
    # ============================================
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # 7) 보안: 숨김 파일 접근 차단
    # ============================================
    location ~ /\. {
        deny all;
        return 404;
    }
}
