<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - BBooster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --kakao: #FEE500;
      --kakao-text: #000000;
      --google-border: #dadce0;
      --secondary: #10b981;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #f8fafc 50%, #f0fdf4 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 24px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--primary); }

    .login-card {
      background: var(--card);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: var(--shadow);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 16px;
    }
    .login-logo img {
      height: 64px;
      width: auto;
    }
    .logo-fallback {
      font-size: 32px;
      font-weight: 900;
    }
    .logo-fallback .b { color: #3b82f6; }
    .logo-fallback .booster { color: #ef4444; }

    .login-title {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.2s;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s;
      background: var(--bg);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59,130,246,0.4);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      padding: 0 16px;
    }

    /* Kakao Button */
    .btn-kakao {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: var(--kakao);
      color: var(--kakao-text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      font-family: inherit;
      margin-bottom: 12px;
    }
    .btn-kakao:hover {
      filter: brightness(0.95);
    }

    /* Google Button */
    .btn-google {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--google-border);
      background: var(--card);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-google:hover {
      background: var(--bg);
      border-color: var(--text-muted);
    }

    .error-message {
      background: #fef2f2;
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .error-message.show { display: block; }

    .success-message {
      background: #f0fdf4;
      color: var(--secondary);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show { display: block; }

    .form-panel {
      display: none;
    }
    .form-panel.active { display: block; }

    .password-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .password-requirements {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .pwd-check {
      font-size: 11px;
      padding: 4px 8px;
      background: #f1f5f9;
      border-radius: 4px;
      color: var(--text-muted);
    }
    .pwd-check.valid {
      background: #dcfce7;
      color: #16a34a;
    }

    /* Terms checkboxes */
    .terms-section {
      margin: 20px 0;
      padding: 16px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .terms-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }
    .terms-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      font-size: 13px;
      color: var(--text);
    }
    .terms-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .terms-item label {
      cursor: pointer;
      flex: 1;
    }
    .terms-item a {
      color: var(--primary);
      text-decoration: none;
      font-size: 12px;
    }
    .terms-item a:hover {
      text-decoration: underline;
    }
    .terms-item.required label::before {
      content: '[필수] ';
      color: var(--danger);
    }
    .terms-item.optional label::before {
      content: '[선택] ';
      color: var(--text-muted);
    }
    .terms-all {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: white;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 9999;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <a href="/" class="back-link">← 홈으로</a>

    <div class="login-card">
      <div class="login-logo">
        <img src="/static/logo_v3.png" alt="BBooster" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
        <span class="logo-fallback" style="display:none;"><span class="b">B</span><span class="booster">Booster</span></span>
      </div>
      <div class="login-title" id="pageTitle">로그인</div>
      <div class="login-subtitle">AI 투자 분석 시스템</div>

      <div class="tabs">
        <div class="tab active" data-tab="login" onclick="switchTab('login')">로그인</div>
        <div class="tab" data-tab="register" onclick="switchTab('register')">회원가입</div>
      </div>

      <!-- Login Form -->
      <div class="form-panel active" id="loginPanel">
        <div class="error-message" id="loginError"></div>

        <!-- Social Login Buttons -->
        <button class="btn-kakao" onclick="loginWithKakao()">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#000000" d="M12 3C6.48 3 2 6.48 2 10.8c0 2.76 1.84 5.18 4.6 6.54-.2.76-.74 2.74-.85 3.16-.13.52.19.51.4.37.17-.11 2.62-1.78 3.68-2.5.7.1 1.44.16 2.17.16 5.52 0 10-3.48 10-7.76S17.52 3 12 3z"/>
          </svg>
          카카오로 시작하기
        </button>

        <button class="btn-google" onclick="loginWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google로 시작하기
        </button>

        <div class="divider"><span>또는 이메일로 로그인</span></div>

        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label">이메일</label>
            <input type="email" class="form-input" id="loginEmail" placeholder="example@email.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">비밀번호</label>
            <input type="password" class="form-input" id="loginPassword" placeholder="비밀번호 입력" required minlength="12">
          </div>
          <button type="submit" class="btn btn-primary" id="loginBtn">로그인</button>
        </form>
      </div>

      <!-- Register Form -->
      <div class="form-panel" id="registerPanel">
        <div class="error-message" id="registerError"></div>
        <div class="success-message" id="registerSuccess"></div>

        <!-- Social Login Buttons -->
        <button class="btn-kakao" onclick="loginWithKakao()">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#000000" d="M12 3C6.48 3 2 6.48 2 10.8c0 2.76 1.84 5.18 4.6 6.54-.2.76-.74 2.74-.85 3.16-.13.52.19.51.4.37.17-.11 2.62-1.78 3.68-2.5.7.1 1.44.16 2.17.16 5.52 0 10-3.48 10-7.76S17.52 3 12 3z"/>
          </svg>
          카카오로 시작하기
        </button>

        <button class="btn-google" onclick="loginWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google로 시작하기
        </button>

        <div class="divider"><span>또는 이메일로 가입</span></div>

        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label">이메일</label>
            <input type="email" class="form-input" id="registerEmail" placeholder="example@email.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">비밀번호</label>
            <input type="password" class="form-input" id="registerPassword" placeholder="12자 이상, 영문+숫자+특수문자 포함" required minlength="12" oninput="checkPassword()">
            <div class="password-requirements">
              <span class="pwd-check" id="pwdLength">12자 이상</span>
              <span class="pwd-check" id="pwdLetter">영문자</span>
              <span class="pwd-check" id="pwdNumber">숫자</span>
              <span class="pwd-check" id="pwdSpecial">특수문자</span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">비밀번호 확인</label>
            <input type="password" class="form-input" id="registerPasswordConfirm" placeholder="비밀번호 다시 입력" required minlength="12">
          </div>

          <!-- Terms Checkboxes -->
          <div class="terms-section">
            <div class="terms-title">약관 동의</div>
            <div class="terms-item terms-all">
              <input type="checkbox" id="agreeAll" onchange="toggleAllTerms()">
              <label for="agreeAll">전체 동의</label>
            </div>
            <div class="terms-item required">
              <input type="checkbox" id="agreeTerms" class="required-term" onchange="checkTerms()">
              <label for="agreeTerms">이용약관 동의</label>
              <a href="/api/auth/terms/terms?full=true" target="_blank">보기</a>
            </div>
            <div class="terms-item required">
              <input type="checkbox" id="agreePrivacy" class="required-term" onchange="checkTerms()">
              <label for="agreePrivacy">개인정보 처리방침 동의</label>
              <a href="/api/auth/terms/privacy?full=true" target="_blank">보기</a>
            </div>
            <div class="terms-item required">
              <input type="checkbox" id="agreeAge" class="required-term" onchange="checkTerms()">
              <label for="agreeAge">만 14세 이상입니다</label>
            </div>
            <div class="terms-item required">
              <input type="checkbox" id="agreeRisk" class="required-term" onchange="checkTerms()">
              <label for="agreeRisk">투자 위험 고지 확인</label>
              <a href="/api/auth/terms/investment_risk?full=true" target="_blank">보기</a>
            </div>
            <div class="terms-item optional">
              <input type="checkbox" id="agreeMarketing" onchange="checkTerms()">
              <label for="agreeMarketing">마케팅 정보 수신 동의</label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="registerBtn" disabled>회원가입</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Get redirect URL from next parameter (or default to /)
    function getRedirectUrl() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next');
      // 보안: 같은 도메인 경로만 허용 (외부 URL 방지)
      if (next && next.startsWith('/') && !next.startsWith('//')) {
        return next;
      }
      return '/';
    }

    // Check if already logged in
    function checkAuth() {
      const token = localStorage.getItem('bbooster_access_token');
      if (token) {
        window.location.href = getRedirectUrl();
      }
    }

    // Social signup token (for consent flow)
    let socialSignupToken = null;

    // Check URL params for register tab
    function checkUrlParams() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('register') === 'true') {
        switchTab('register');
      }

      // Check for OAuth callback tokens
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      if (accessToken && refreshToken) {
        localStorage.setItem('bbooster_access_token', accessToken);
        localStorage.setItem('bbooster_refresh_token', refreshToken);
        // 로그인 성공 시 데모 모드 즉시 해제
        localStorage.removeItem('bbooster_demo_mode');
        // OAuth 콜백에서 next 파라미터 확인
        const oauthNext = params.get('next') || sessionStorage.getItem('login_next') || '/';
        sessionStorage.removeItem('login_next');
        window.location.href = oauthNext.startsWith('/') && !oauthNext.startsWith('//') ? oauthNext : '/';
      }

      // 세션 만료 에러 처리
      if (params.get('error') === 'session_expired') {
        showToast('세션이 만료되었습니다. 다시 로그인해주세요.');
        // URL에서 에러 파라미터 제거
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      // Check for consent redirect (new social signup)
      if (params.get('signup') === 'consent' && params.get('token')) {
        socialSignupToken = params.get('token');
        console.log('[Consent] Social signup mode, token length:', socialSignupToken.length);
        switchTab('register');
        // 소셜 로그인 신규 가입 모드: 이메일/비밀번호 필드 숨김
        document.querySelectorAll('#registerPanel .form-group').forEach(el => el.style.display = 'none');
        document.querySelectorAll('#registerPanel .btn-kakao, #registerPanel .btn-google, #registerPanel .divider').forEach(el => el.style.display = 'none');
        // 숨겨진 필드의 required 속성 제거 (form validation 에러 방지)
        document.getElementById('registerEmail').removeAttribute('required');
        document.getElementById('registerPassword').removeAttribute('required');
        document.getElementById('registerPasswordConfirm').removeAttribute('required');
        document.getElementById('pageTitle').textContent = '약관 동의';
        document.getElementById('registerBtn').textContent = '가입 완료';
        // 약관 체크 상태 초기화
        checkTerms();
        console.log('[Consent] Button disabled:', document.getElementById('registerBtn').disabled);
        showToast('약관에 동의하고 가입을 완료해주세요');
      }
    }

    // Switch tabs
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));

      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
      document.getElementById(tab === 'login' ? 'loginPanel' : 'registerPanel').classList.add('active');
      document.getElementById('pageTitle').textContent = tab === 'login' ? '로그인' : '회원가입';

      // Clear errors
      document.getElementById('loginError').classList.remove('show');
      document.getElementById('registerError').classList.remove('show');
      document.getElementById('registerSuccess').classList.remove('show');
    }

    // Password validation
    function checkPassword() {
      const password = document.getElementById('registerPassword').value;

      const checks = {
        length: password.length >= 12,
        letter: /[A-Za-z]/.test(password),
        number: /[0-9]/.test(password),
        special: /[!@#$%^&*()_+\-=\[\]{}|;:,.<>?/~`]/.test(password)
      };

      document.getElementById('pwdLength').classList.toggle('valid', checks.length);
      document.getElementById('pwdLetter').classList.toggle('valid', checks.letter);
      document.getElementById('pwdNumber').classList.toggle('valid', checks.number);
      document.getElementById('pwdSpecial').classList.toggle('valid', checks.special);

      checkTerms();
    }

    // Terms checkbox handling
    function toggleAllTerms() {
      const allChecked = document.getElementById('agreeAll').checked;
      document.querySelectorAll('.terms-item input[type="checkbox"]').forEach(cb => {
        if (cb.id !== 'agreeAll') cb.checked = allChecked;
      });
      checkTerms();
    }

    function checkTerms() {
      const requiredTerms = document.querySelectorAll('.required-term');
      const allRequired = Array.from(requiredTerms).every(cb => cb.checked);

      // 소셜 로그인 신규 사용자는 비밀번호 검증 불필요
      let passwordValid = true;
      if (!socialSignupToken) {
        const password = document.getElementById('registerPassword').value;
        passwordValid = password.length >= 12 &&
          /[A-Za-z]/.test(password) &&
          /[0-9]/.test(password) &&
          /[!@#$%^&*()_+\-=\[\]{}|;:,.<>?/~`]/.test(password);
      }

      const shouldEnable = allRequired && passwordValid;
      console.log('[checkTerms] allRequired:', allRequired, 'passwordValid:', passwordValid, 'socialToken:', !!socialSignupToken, '-> enable:', shouldEnable);
      document.getElementById('registerBtn').disabled = !shouldEnable;

      // Update "all" checkbox
      const allTerms = document.querySelectorAll('.terms-item input[type="checkbox"]:not(#agreeAll)');
      document.getElementById('agreeAll').checked = Array.from(allTerms).every(cb => cb.checked);
    }

    // Login handler
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');

      btn.disabled = true;
      btn.textContent = '로그인 중...';
      errorEl.classList.remove('show');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.access_token) {
          localStorage.setItem('bbooster_access_token', data.access_token);
          localStorage.setItem('bbooster_refresh_token', data.refresh_token);
          // 로그인 성공 시 데모 모드 즉시 해제
          localStorage.removeItem('bbooster_demo_mode');
          window.location.href = getRedirectUrl();
        } else {
          errorEl.textContent = data.detail || '로그인에 실패했습니다';
          errorEl.classList.add('show');
        }
      } catch (error) {
        errorEl.textContent = '서버 연결에 실패했습니다';
        errorEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = '로그인';
      }
    }

    // Register handler
    async function handleRegister(e) {
      e.preventDefault();
      console.log('[Register] handleRegister called, socialSignupToken:', !!socialSignupToken);

      const btn = document.getElementById('registerBtn');
      const errorEl = document.getElementById('registerError');
      const successEl = document.getElementById('registerSuccess');

      btn.disabled = true;
      btn.textContent = '가입 중...';
      errorEl.classList.remove('show');
      successEl.classList.remove('show');

      try {
        let res, data;

        // 소셜 로그인 신규 사용자 (약관 동의만 필요)
        if (socialSignupToken) {
          res = await fetch('/api/auth/complete-signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token: socialSignupToken,
              terms_agreed: document.getElementById('agreeTerms').checked,
              privacy_agreed: document.getElementById('agreePrivacy').checked,
              age_confirmed: document.getElementById('agreeAge').checked,
              investment_risk_agreed: document.getElementById('agreeRisk').checked,
              marketing_agreed: document.getElementById('agreeMarketing').checked
            })
          });
        } else {
          // 일반 이메일 회원가입
          const email = document.getElementById('registerEmail').value.trim();
          const password = document.getElementById('registerPassword').value;
          const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

          // Validation
          if (password !== passwordConfirm) {
            errorEl.textContent = '비밀번호가 일치하지 않습니다';
            errorEl.classList.add('show');
            btn.disabled = false;
            btn.textContent = '회원가입';
            return;
          }

          // Password policy
          if (password.length < 12) {
            errorEl.textContent = '비밀번호는 12자 이상이어야 합니다';
            errorEl.classList.add('show');
            btn.disabled = false;
            btn.textContent = '회원가입';
            return;
          }

          res = await fetch('/api/auth/register-with-consent', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email,
              password,
              name: null,
              terms_agreed: document.getElementById('agreeTerms').checked,
              privacy_agreed: document.getElementById('agreePrivacy').checked,
              age_confirmed: document.getElementById('agreeAge').checked,
              investment_risk_agreed: document.getElementById('agreeRisk').checked,
              marketing_agreed: document.getElementById('agreeMarketing').checked
            })
          });
        }

        data = await res.json();

        if (res.ok && data.access_token) {
          localStorage.setItem('bbooster_access_token', data.access_token);
          localStorage.setItem('bbooster_refresh_token', data.refresh_token);
          // 가입 완료 시 데모 모드 즉시 해제
          localStorage.removeItem('bbooster_demo_mode');
          window.location.href = getRedirectUrl();
        } else {
          errorEl.textContent = data.detail || '회원가입에 실패했습니다';
          errorEl.classList.add('show');
        }
      } catch (error) {
        errorEl.textContent = '서버 연결에 실패했습니다';
        errorEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = socialSignupToken ? '가입 완료' : '회원가입';
        checkTerms(); // Re-check to enable/disable button
      }
    }

    // Social logins
    function loginWithKakao() {
      // next 파라미터를 sessionStorage에 저장 (OAuth 콜백 후 사용)
      const nextUrl = getRedirectUrl();
      if (nextUrl !== '/') {
        sessionStorage.setItem('login_next', nextUrl);
      }
      window.location.href = '/api/auth/kakao/login';
    }

    function loginWithGoogle() {
      // next 파라미터를 sessionStorage에 저장 (OAuth 콜백 후 사용)
      const nextUrl = getRedirectUrl();
      if (nextUrl !== '/') {
        sessionStorage.setItem('login_next', nextUrl);
      }
      window.location.href = '/api/auth/google/login';
    }

    // Toast
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // Initialize
    checkAuth();
    checkUrlParams();
  </script>
</body>
</html>
