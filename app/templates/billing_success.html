<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 처리 중 - QUBE System</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --bg: #0F172A;
      --bg-card: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #334155;
      --success: #10B981;
      --danger: #EF4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 480px;
      padding: 48px 24px;
      text-align: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 32px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .icon.loading {
      background: rgba(59, 130, 246, 0.2);
      animation: pulse 1.5s infinite;
    }

    .icon.success {
      background: rgba(16, 185, 129, 0.2);
    }

    .icon.error {
      background: rgba(239, 68, 68, 0.2);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .message {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .plan-info {
      background: var(--bg);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .plan-info .plan-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--primary);
    }

    .plan-info .plan-price {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(59, 130, 246, 0.3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .error-message {
      color: var(--danger);
      font-size: 14px;
      margin-top: 16px;
      display: none;
    }

    .error-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">QUBE System</div>

    <div class="card">
      <div class="icon loading" id="statusIcon">
        <div class="spinner"></div>
      </div>

      <h1 id="statusTitle">결제 처리 중</h1>

      <p class="message" id="statusMessage">
        카드 등록 및 첫 결제를 진행하고 있습니다.<br>
        잠시만 기다려주세요...
      </p>

      <div class="plan-info" id="planInfo">
        <div class="plan-name" id="planName">-</div>
        <div class="plan-price" id="planPrice">-</div>
      </div>

      <div id="actionArea" style="display:none;">
        <a href="/pricing" class="btn btn-primary">요금제 페이지로</a>
      </div>

      <p class="error-message" id="errorMessage"></p>
    </div>
  </div>

  <script>
    const PLAN_NAMES = {
      standard: 'Standard',
      pro: 'Pro',
      proplus: 'Pro+',
      promax: 'Pro Max'
    };

    const PLAN_PRICES = {
      standard: 19900,
      pro: 99000,
      proplus: 149000,
      promax: 249000
    };

    // URL 파라미터 추출
    const params = new URLSearchParams(window.location.search);
    const authKey = params.get('authKey');
    const customerKey = params.get('customerKey');
    const plan = params.get('plan');

    // 플랜 정보 표시
    if (plan && PLAN_NAMES[plan]) {
      document.getElementById('planName').textContent = PLAN_NAMES[plan] + ' 플랜';
      document.getElementById('planPrice').textContent = '₩' + PLAN_PRICES[plan].toLocaleString() + '/월';
    }

    // 결제 처리
    async function processPayment() {
      const token = localStorage.getItem('bbooster_access_token');

      if (!authKey || !customerKey || !plan) {
        showError('필수 파라미터가 누락되었습니다.');
        return;
      }

      if (!token) {
        showError('로그인이 필요합니다.');
        setTimeout(() => {
          window.location.href = '/login?next=/pricing';
        }, 2000);
        return;
      }

      try {
        const res = await fetch('/api/billing/confirm', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            auth_key: authKey,
            customer_key: customerKey,
            plan: plan
          })
        });

        const result = await res.json();

        if (result.success) {
          showSuccess(result);
        } else {
          showError(result.message || '결제 처리에 실패했습니다.');
        }

      } catch (e) {
        console.error('결제 처리 실패:', e);
        showError('서버 연결에 실패했습니다.');
      }
    }

    function showSuccess(result) {
      document.getElementById('statusIcon').className = 'icon success';
      document.getElementById('statusIcon').innerHTML = '✓';
      document.getElementById('statusTitle').textContent = '구독 완료!';
      document.getElementById('statusMessage').innerHTML =
        `${PLAN_NAMES[plan]} 플랜 구독이 완료되었습니다.<br>` +
        `결제 금액: ₩${(result.amount || 0).toLocaleString()}`;

      if (result.next_billing_at) {
        const nextDate = new Date(result.next_billing_at);
        document.getElementById('statusMessage').innerHTML +=
          `<br>다음 결제일: ${nextDate.toLocaleDateString('ko-KR')}`;
      }

      document.getElementById('actionArea').style.display = 'block';

      // 3초 후 자동 이동
      setTimeout(() => {
        window.location.href = '/pricing?success=true&plan=' + plan;
      }, 3000);
    }

    function showError(message) {
      document.getElementById('statusIcon').className = 'icon error';
      document.getElementById('statusIcon').innerHTML = '✕';
      document.getElementById('statusTitle').textContent = '결제 실패';
      document.getElementById('statusMessage').textContent = '결제 처리 중 오류가 발생했습니다.';
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('errorMessage').classList.add('show');
      document.getElementById('actionArea').style.display = 'block';
    }

    // 페이지 로드 시 결제 처리 시작
    processPayment();
  </script>
</body>
</html>
