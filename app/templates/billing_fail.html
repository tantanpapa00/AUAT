<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 실패 - QUBE System</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --bg: #0F172A;
      --bg-card: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #334155;
      --danger: #EF4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 480px;
      padding: 48px 24px;
      text-align: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 32px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: var(--danger);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .message {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .error-code {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 13px;
      color: var(--danger);
      margin-bottom: 24px;
      word-break: break-all;
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      margin: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: var(--bg);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">QUBE System</div>

    <div class="card">
      <div class="icon">✕</div>

      <h1>카드 등록 실패</h1>

      <p class="message" id="errorMessage">
        카드 등록 중 오류가 발생했습니다.<br>
        다시 시도해 주세요.
      </p>

      <div class="error-code" id="errorCode" style="display:none;"></div>

      <div>
        <a href="/pricing" class="btn btn-primary">다시 시도</a>
        <a href="/" class="btn btn-outline">홈으로</a>
      </div>
    </div>
  </div>

  <script>
    // URL 파라미터에서 에러 정보 추출
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const message = params.get('message');

    if (message) {
      document.getElementById('errorMessage').innerHTML =
        decodeURIComponent(message) + '<br>다시 시도해 주세요.';
    }

    if (code) {
      document.getElementById('errorCode').style.display = 'block';
      document.getElementById('errorCode').textContent = '에러 코드: ' + code;
    }
  </script>
</body>
</html>
