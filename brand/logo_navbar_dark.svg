    <linearGradient id="nRing" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#DC2626"/><stop offset="50%" style="stop-color:#EF4444"/><stop offset="100%" style="stop-color:#FBBF24"/></linearGradient>
